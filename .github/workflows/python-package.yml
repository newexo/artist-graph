name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.3.4
        virtualenvs-create: true
        virtualenvs-in-project: false

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        poetry install --with dev

    # Optional: run formatting only as feedback (not required for CI pass)
    # - name: Format code
    #   run: make format

    - name: Lint
      run: make lint

    - name: Run tests
      run: make test

    - name: Coverage check
      run: make coverage

  postgres:
    # The cache's concurrency tests need a real Postgres (row locks, ON CONFLICT).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 2.3.4
        virtualenvs-create: true
        virtualenvs-in-project: false

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        poetry install --with dev

    - name: Run tests against Postgres
      run: poetry run pytest art_graph/tests/test_cache_concurrency.py art_graph/tests/test_cache_schema.py art_graph/tests/test_cache_operations.py -v
